name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and find project
        run: |
          unzip -o survival-day-counter.zip -d app
          DIR=$(dirname "$(find app -maxdepth 3 -name 'build.gradle*' | head -1)")
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --stacktrace
        working-directory: ${{ env.PROJECT_DIR }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/build/libs/*.jar
