name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and find project
        run: |
          rm -rf app
          unzip -o survival-day-counter.zip -d app
          GRADLE_FILE=$(find app -maxdepth 3 -name 'build.gradle*' | head -1)
          if [ -z "$GRADLE_FILE" ]; then echo "build.gradle not found in zip"; find app; exit 1; fi
          DIR=$(dirname "$GRADLE_FILE")
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle build
        working-directory: ${{ env.PROJECT_DIR }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/build/libs/survival-day-counter-1.0.0.jar
